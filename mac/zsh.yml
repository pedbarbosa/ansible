---
- hosts: localhost
  connection: local
  tasks:
  - name: zsh - Read secrets from file
    include_vars:
      file: ../local/secrets.yml
  - name: Check if zsh and starship are installed
    package:
      name: [zsh, zsh-completions, starship]
      state: present
  # macOS gives root /bin/sh, so sudo -i wouldn't load any of the setup below
  - name: Set zsh as root's shell
    become: yes
    user:
      name: root
      shell: /bin/zsh
  # The tasks below run once per account in dotfile_users (the login user and root)
  - name: Configure .zprofile
    copy:
      src: files/zprofile
      dest: ~/.zprofile
      mode: 0640
    become: yes
    become_user: "{{ dotfile_user }}"
    loop: "{{ dotfile_users }}"
    loop_control:
      loop_var: dotfile_user
  - name: Configure .zshrc
    template:
      src: files/zshrc.j2
      dest: ~/.zshrc
      mode: 0640
    become: yes
    become_user: "{{ dotfile_user }}"
    loop: "{{ dotfile_users }}"
    loop_control:
      loop_var: dotfile_user
  - name: Ensure ~/.config exists
    file:
      path: ~/.config
      state: directory
    become: yes
    become_user: "{{ dotfile_user }}"
    loop: "{{ dotfile_users }}"
    loop_control:
      loop_var: dotfile_user
  - name: Configure starship prompt
    copy:
      src: files/starship.toml
      dest: ~/.config/starship.toml
      mode: 0640
    become: yes
    become_user: "{{ dotfile_user }}"
    loop: "{{ dotfile_users }}"
    loop_control:
      loop_var: dotfile_user
  - name: Clone oh-my-zsh git repository
    git:
      repo: 'https://github.com/robbyrussell/oh-my-zsh.git'
      dest: ~/.oh-my-zsh
    environment: "{{ dotfile_env }}"
    become: yes
    become_user: "{{ dotfile_user }}"
    loop: "{{ dotfile_users }}"
    loop_control:
      loop_var: dotfile_user
  - name: Remove powerlevel10k theme, replaced by starship
    file:
      path: ~/.oh-my-zsh/custom/themes/powerlevel10k
      state: absent
    become: yes
    become_user: "{{ dotfile_user }}"
    loop: "{{ dotfile_users }}"
    loop_control:
      loop_var: dotfile_user
  - name: Clone fzf git repository
    git:
      repo: 'https://github.com/junegunn/fzf.git'
      dest: ~/.fzf
    environment: "{{ dotfile_env }}"
    become: yes
    become_user: "{{ dotfile_user }}"
    loop: "{{ dotfile_users }}"
    loop_control:
      loop_var: dotfile_user
    register: fzf
  # Generates ~/.fzf.zsh, which .zshrc sources
  - name: Install fzf
    command:
      cmd: ./install --key-bindings --completion --no-update-rc
      chdir: ~/.fzf
    environment: "{{ dotfile_env }}"
    become: yes
    become_user: "{{ item.dotfile_user }}"
    loop: "{{ fzf.results }}"
    loop_control:
      label: "{{ item.dotfile_user }}"
    when: item.changed

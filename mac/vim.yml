---
- hosts: localhost
  connection: local
  tasks:
    - name: Check if vim is installed
      package:
        name: vim
        state: present

    # The tasks below run once per account in dotfile_users (the login user and root)
    - name: Ensure .vim/autoload directory exists
      file:
        path: ~/.vim/autoload
        state: directory
        mode: 0750
      become: yes
      become_user: "{{ dotfile_user }}"
      loop: "{{ dotfile_users }}"
      loop_control:
        loop_var: dotfile_user

    - name: Configure vimrc
      copy:
        src: files/vimrc
        dest: ~/.vimrc
        mode: 0640
      become: yes
      become_user: "{{ dotfile_user }}"
      loop: "{{ dotfile_users }}"
      loop_control:
        loop_var: dotfile_user

    # Downloads only when plug.vim is missing (get_url doesn't re-fetch by default)
    - name: Install vim-plug
      ansible.builtin.get_url:
        url: https://raw.githubusercontent.com/junegunn/vim-plug/master/plug.vim
        dest: ~/.vim/autoload/plug.vim
        mode: 0640
      become: yes
      become_user: "{{ dotfile_user }}"
      loop: "{{ dotfile_users }}"
      loop_control:
        loop_var: dotfile_user

    - name: Install vim plugins
      command: "vim -es -u ~/.vimrc -i NONE +'PlugInstall --sync' +qa"
      args:
        creates: ~/.vim/plugged
      become: yes
      become_user: "{{ dotfile_user }}"
      loop: "{{ dotfile_users }}"
      loop_control:
        loop_var: dotfile_user

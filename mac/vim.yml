---
- name: mac/vim
  hosts: localhost
  connection: local
  tasks:
    - name: Check if vim is installed
      package:
        name: vim
        state: present

    # The tasks below run once per account in dotfile_users (the login user and root)
    # Created even in check mode: copy fails if its destination folder is
    # missing, so root's first dry run would otherwise always fail
    - name: Ensure .vim/autoload directory exists
      file:
        path: ~/.vim/autoload
        state: directory
        mode: 0750
      check_mode: false
      become: yes
      become_user: "{{ dotfile_user }}"
      loop: "{{ dotfile_users }}"
      loop_control:
        loop_var: dotfile_user

    - name: Configure vimrc
      copy:
        src: files/vimrc
        dest: ~/.vimrc
        mode: 0640
      become: yes
      become_user: "{{ dotfile_user }}"
      loop: "{{ dotfile_users }}"
      loop_control:
        loop_var: dotfile_user

    # get_url can't tell in a dry run whether plug.vim changed: check mode only
    # sends a HEAD request, compares the file with an empty download and always
    # reports a change. So fetch it with uri (a read, safe in a dry run) and let
    # copy compare it. No diff: an update would print the whole file.
    - name: Download vim-plug
      uri:
        url: https://raw.githubusercontent.com/junegunn/vim-plug/master/plug.vim
        return_content: yes
      register: vim_plug
      check_mode: false

    # Only reports changed when the latest plug.vim differs
    - name: Install vim-plug
      copy:
        content: "{{ vim_plug.content }}"
        dest: ~/.vim/autoload/plug.vim
        mode: 0640
      diff: false
      become: yes
      become_user: "{{ dotfile_user }}"
      loop: "{{ dotfile_users }}"
      loop_control:
        loop_var: dotfile_user

    - name: Install vim plugins
      command: "vim -es -u ~/.vimrc -i NONE +'PlugInstall --sync' +qa"
      args:
        creates: ~/.vim/plugged
      environment: "{{ dotfile_env }}"
      become: yes
      become_user: "{{ dotfile_user }}"
      loop: "{{ dotfile_users }}"
      loop_control:
        loop_var: dotfile_user

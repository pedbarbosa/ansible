---
- hosts: localhost
  connection: local
  tasks:
    - name: Check if base packages are installed
      package:
        name: [aria2, awscli, bash, curl, dos2unix, gh, git, grep, jq, ncdu, nmap, openssh, telnet, wget]
        state: present
    - name: Configure .gitconfig
      copy:
        src: files/gitconfig
        dest: "{{ home_dir }}/.gitconfig"
        mode: 0640
    - name: slack-notify - Install requests module
      ansible.builtin.pip:
        name: requests
        executable: pip3
        extra_args: --break-system-packages
    - name: slack-notify - Read secrets from file
      include_vars:
        file: ../secrets.yml
    - name: slack-notify - Ensure config directory exists
      become: yes
      file:
        path: /etc/slack-notify
        state: directory
        owner: root
        group: wheel
        mode: 0750
    - name: slack-notify - Configure webhook file
      become: yes
      copy:
        content: "{{ slack_notify_webhook_url }}\n"
        dest: /etc/slack-notify/webhook
        owner: root
        group: wheel
        mode: 0600
    - name: slack-notify - Install script
      become: yes
      copy:
        src: "{{ playbook_dir }}/../files/slack-notify"
        dest: /usr/local/bin/slack-notify
        owner: root
        group: wheel
        mode: 0755


---
- name: ubuntu/samba
  hosts: all
  become: yes
  become_user: root
  vars_files:
    - ../local/secrets.yml
  tasks:
    - name: samba - check if installed
      apt:
        name: samba
        state: present

    # The shares' `force group` (smb_shared-perms.conf). Fixed IDs because
    # server-stack's Kodi container runs as them (KODI_PUID/KODI_PGID).
    - name: samba - create the share group
      group:
        name: "{{ collectd_hostname }}"
        gid: 1002
        state: present

    - name: samba - create share user
      user:
        name: "{{ share_user_account }}"
        uid: 1001
        shell: /usr/sbin/nologin
        create_home: no
        password_lock: yes
        groups: "{{ collectd_hostname }}"
        append: true
        state: present

    - name: samba - add the main user to the share group
      user:
        name: "{{ main_user_account }}"
        groups: "{{ collectd_hostname }}"
        append: true

    - name: samba - configure smb.conf
      template:
        src: files/smb.conf
        dest: /etc/samba/smb.conf
        owner: root
        group: root
        mode: 0644
      notify: samba - Restart

    - name: samba - configure shared permissions
      template:
        src: files/smb_shared-perms.conf
        dest: /etc/samba/shared-perms.conf
        owner: root
        group: root
        mode: 0644
      notify: samba - Restart

  handlers:
    - name: samba - Restart
      service:
        name: smbd.service
        state: restarted

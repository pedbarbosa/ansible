---
- hosts: all
  become: yes
  become_user: root
  tasks:
    - name: samba - check if installed
      apt:
        name: samba
        state: present

    - name: samba - read secrets from file
      include_vars:
        file: ../local/secrets.yml

    - name: samba - create share user
      user:
        name: "{{ share_user_account }}"
        shell: /usr/sbin/nologin
        create_home: no
        password_lock: yes
        state: present

    - name: samba - configure smb.conf
      template:
        src: files/smb.conf
        dest: /etc/samba/smb.conf
        owner: root
        group: root
        mode: 0644
      notify: samba - Restart

    - name: samba - configure shared permissions
      template:
        src: files/smb_shared-perms.conf
        dest: /etc/samba/shared-perms.conf
        owner: root
        group: root
        mode: 0644
      notify: samba - Restart

  handlers:
    - name: samba - Restart
      service:
        name: smbd.service
        state: restarted

---
- hosts: all
  become: yes
  become_user: root
  tasks:
    - name: docker - read secrets from file
      include_vars:
        file: ../local/secrets.yml

    - name: docker - package requirements
      apt:
        name: ca-certificates, curl
        state: latest
        update_cache: yes

    # Downloads the key to /etc/apt/keyrings/docker.asc - the same path the old
    # get_url task used, so there's no old key to clean up here.
    - name: docker - add repository
      ansible.builtin.deb822_repository:
        name: docker
        types: deb
        uris: https://download.docker.com/linux/ubuntu
        suites: "{{ ansible_facts['lsb']['codename'] }}"
        components: stable
        architectures: amd64
        signed_by: https://download.docker.com/linux/ubuntu/gpg

    - name: docker - remove old one-line repository file
      file:
        path: /etc/apt/sources.list.d/download_docker_com_linux_ubuntu.list
        state: absent

    - name: docker - install packages
      apt:
        name: docker-ce, docker-ce-cli, containerd.io, docker-buildx-plugin, docker-compose-plugin, python3-docker
        state: latest
        update_cache: yes

    - name: docker - add user to 'docker' group
      ansible.builtin.user:
        name: "{{ main_user_account }}"
        groups: docker
        append: true

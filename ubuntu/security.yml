---
- hosts: all
  become: yes
  become_user: root
  tasks:
    - name: lynis - set cisofy repo
      ansible.builtin.deb822_repository:
        name: cisofy-lynis
        types: deb
        uris: https://packages.cisofy.com/community/lynis/deb/
        suites: stable
        components: main
        signed_by: https://packages.cisofy.com/keys/cisofy-software-public.key

    # The old key sat in trusted.gpg.d, which trusts it for every repository;
    # the deb822 repo above now pins its own copy under /etc/apt/keyrings.
    - name: lynis - remove old one-line repo file and globally trusted key
      file:
        path: "{{ item }}"
        state: absent
      loop:
        - /etc/apt/sources.list.d/cisofy-lynis.list
        - /etc/apt/trusted.gpg.d/cisofy-key.asc

    - name: security - check if required packages are installed
      apt:
        name: acct, apt-listchanges, apt-show-versions, auditd, debsums, fail2ban, libpam-tmpdir, lynis, needrestart, sysstat
        state: present

    - name: sysstat - configure service
      copy:
        src: files/sysstat
        dest: /etc/default/sysstat
        owner: root
        group: root
        mode: 0644

    - name: sysstat - enable and start monitoring
      systemd:
        name: sysstat
        state: started

    - name: security - set SSH local banner
      copy:
        src: files/issue
        dest: /etc/issue
        owner: root
        group: root
        mode: 0644

    - name: security - set SSH network banner
      copy:
        src: files/issue
        dest: /etc/issue.net
        owner: root
        group: root
        mode: 0644

    - name: security - set limits.conf
      copy:
        src: files/limits.conf
        dest: /etc/security/limits.conf
        owner: root
        group: root
        mode: 0644

    - name: security - disable modules for unused protocols
      copy:
        src: files/security-hardening.conf
        dest: /etc/modprobe.d/security-hardening.conf
        owner: root
        group: root
        mode: 0644

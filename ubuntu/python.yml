---
- name: ubuntu/python (packages)
  hosts: all
  become: yes
  become_user: root
  tasks:
    - name: python - check if base packages are installed
      apt:
        name: libbz2-dev, libreadline-dev, libsqlite3-dev, python3, python3-pip
        state: present

- name: ubuntu/python (pyenv)
  hosts: all
  tasks:
    - name: python - install / update pyenv
      git:
        repo: 'https://github.com/pyenv/pyenv.git'
        dest: ~/.pyenv
        update: yes

    - name: python - install / update virtualenv
      git:
        repo: 'https://github.com/pyenv/pyenv-virtualenv.git'
        dest: ~/.pyenv/plugins/pyenv-virtualenv
        update: yes

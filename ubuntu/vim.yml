---
- name: ubuntu/vim (packages)
  hosts: all
  become: yes
  become_user: root
  tasks:
    - name: vim - check if installed
      apt:
        name: vim
        state: present

# Runs once per account in dotfile_users (the login user and root)
- name: ubuntu/vim (each dotfile user)
  hosts: all
  tasks:
    # Created even in check mode: copy fails if its destination folder is
    # missing, so root's first dry run would otherwise always fail
    - name: vim - create autoload directory
      file:
        path: ~/.vim/autoload
        state: directory
        mode: 0775
      check_mode: false
      become: yes
      become_user: "{{ dotfile_user }}"
      loop: "{{ dotfile_users }}"
      loop_control:
        loop_var: dotfile_user

    # get_url can't tell in a dry run whether plug.vim changed: check mode only
    # sends a HEAD request, compares the file with an empty download and always
    # reports a change. So fetch it with uri (a read, safe in a dry run) and let
    # copy compare it. No diff: an update would print the whole file.
    - name: vim - download vim-plug
      uri:
        url: https://raw.githubusercontent.com/junegunn/vim-plug/master/plug.vim
        return_content: yes
      register: vim_plug
      check_mode: false

    - name: vim - install vim-plug
      copy:
        content: "{{ vim_plug.content }}"
        dest: ~/.vim/autoload/plug.vim
        mode: 0664
      diff: false
      become: yes
      become_user: "{{ dotfile_user }}"
      loop: "{{ dotfile_users }}"
      loop_control:
        loop_var: dotfile_user

    - name: vim - configure vimrc
      copy:
        src: files/vimrc
        dest: ~/.vimrc
        mode: 0664
      become: yes
      become_user: "{{ dotfile_user }}"
      loop: "{{ dotfile_users }}"
      loop_control:
        loop_var: dotfile_user
      register: vimrc

    # Batch mode (-es): without a terminal, a normal vim stops on any vimrc
    # error at "Press ENTER" and the task hangs forever
    - name: vim - install plugins when vimrc changed
      command: vim -es -u ~/.vimrc -i NONE +'PlugInstall --sync' +qa
      become: yes
      become_user: "{{ item.dotfile_user }}"
      loop: "{{ vimrc.results }}"
      loop_control:
        label: "{{ item.dotfile_user }}"
      when: item.changed

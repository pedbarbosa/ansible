---
- hosts: all
  become: yes
  become_user: root
  tasks:
    - name: vim - check if installed
      apt:
        name: vim
        state: present

# Runs once per account in dotfile_users (the login user and root)
- hosts: all
  tasks:
    - name: vim - create autoload directory
      file:
        path: ~/.vim/autoload
        state: directory
        mode: 0775
      become: yes
      become_user: "{{ dotfile_user }}"
      loop: "{{ dotfile_users }}"
      loop_control:
        loop_var: dotfile_user

    - name: vim - install vim-plug
      ansible.builtin.get_url:
        url: https://raw.githubusercontent.com/junegunn/vim-plug/master/plug.vim
        dest: ~/.vim/autoload/plug.vim
        mode: 0664
      become: yes
      become_user: "{{ dotfile_user }}"
      loop: "{{ dotfile_users }}"
      loop_control:
        loop_var: dotfile_user

    - name: vim - configure vimrc
      copy:
        src: files/vimrc
        dest: ~/.vimrc
        mode: 0664
      become: yes
      become_user: "{{ dotfile_user }}"
      loop: "{{ dotfile_users }}"
      loop_control:
        loop_var: dotfile_user
      register: vimrc

    - name: vim - install plugins when vimrc changed
      command: vim +'PlugInstall --sync' +qa
      become: yes
      become_user: "{{ item.dotfile_user }}"
      loop: "{{ vimrc.results }}"
      loop_control:
        label: "{{ item.dotfile_user }}"
      when: item.changed

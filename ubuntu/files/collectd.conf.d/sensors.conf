# File managed by Ansible - https://github.com/pedbarbosa/ansible

LoadPlugin sensors

<Plugin sensors>
  SensorConfigFile "/etc/sensors3.conf"
  # Readings that mean nothing on this board's Nuvoton NCT6791D (names from
  # `sensors -u`, not its labels): an empty fan header, AUXTIN1 (stuck at
  # 100°C) and the PCH_* temperatures (always 0°C)
  Sensor "nct6791-isa-0290/fanspeed-fan3"
  Sensor "nct6791-isa-0290/temperature-temp4"
  Sensor "nct6791-isa-0290/temperature-temp8"
  Sensor "nct6791-isa-0290/temperature-temp9"
  Sensor "nct6791-isa-0290/temperature-temp10"
  Sensor "nct6791-isa-0290/temperature-temp11"
  Sensor "nct6791-isa-0290/temperature-temp12"
  IgnoreSelected true
</Plugin>

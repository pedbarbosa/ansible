# File managed by Ansible - https://github.com/pedbarbosa/ansible

LoadPlugin write_graphite

<Plugin write_graphite>
  <Node "victoriametrics">
    Host "127.0.0.1"
    Port "2003"
    Protocol "tcp"
    LogSendErrors true
    Prefix "collectd."
    StoreRates true
    SeparateInstances true
    AlwaysAppendDS false
    EscapeCharacter "_"
  </Node>
</Plugin>

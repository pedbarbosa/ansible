# File managed by Ansible - https://github.com/pedbarbosa/ansible

LoadPlugin df

<Plugin df>
  MountPoint "/"
  MountPoint "/containers"
{% for disk in pms_data_mounts %}
  MountPoint "{{ disk.mount }}"
{% endfor %}
  MountPoint "{{ pms_parity_mount }}"
  MountPoint "{{ storage_mount }}"
  MountPoint "/scratch"
  # FSType cifs
  # FSType devtmpfs
  # FSType overlay
  # FSType tmpfs
  # FSType udev
  # MountPoint "/mnt"
  IgnoreSelected false
</Plugin>

# File managed by Ansible - https://github.com/pedbarbosa/ansible

# UDP Receive buffer size setting for Syncthing
# https://github.com/quic-go/quic-go/wiki/UDP-Buffer-Sizes
net.core.rmem_max=7500000
net.core.wmem_max=7500000

# Prevent setuid and setgid programs from dumping core
# https://www.cyberciti.biz/faq/disable-core-dumps-in-linux-with-systemd-sysctl
fs.suid_dumpable=0
kernel.core_pattern=|/bin/false


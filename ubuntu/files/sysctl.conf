# File managed by Ansible - https://github.com/pedbarbosa/ansible

# UDP buffer sizes for QUIC-based services: Syncthing, cloudflared and Caddy (HTTP/3)
# https://github.com/quic-go/quic-go/wiki/UDP-Buffer-Sizes
net.core.rmem_max=7500000
net.core.wmem_max=7500000

# Prevent setuid and setgid programs from dumping core
# https://www.cyberciti.biz/faq/disable-core-dumps-in-linux-with-systemd-sysctl
fs.suid_dumpable=0
# Discards all core dumps host-wide, including from containers
kernel.core_pattern=|/bin/false

# Swappiness controls how aggressively the kernel moves memory pages to swap. The value ranges from 0 to 100.
#   0 — only swap when RAM is critically full
#  10 — recommended for servers (keeps more data in RAM)
#  60 — Ubuntu default (more aggressive)
#  100 — swap as aggressively as possible
vm.swappiness=10

# inotify limits. The default of 128 instances is shared by all containers running as the
# same host user, and is easily exhausted by the .NET-based *arr apps and Jellyfin
# (Sonarr, Radarr, Lidarr, Prowlarr), plus Syncthing, Immich, Home Assistant and Kodi
fs.inotify.max_user_instances=1024
# Syncthing, Jellyfin and the *arr apps use one watch per directory in large media libraries
fs.inotify.max_user_watches=524288

# Allow Redis (immich_redis) background saves to fork under memory pressure
# Silences the "Memory overcommit must be enabled" warning in its logs
vm.overcommit_memory=1


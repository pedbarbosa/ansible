---
- hosts: all
  become: yes
  become_user: root
  tasks:
    - name: ubuntu - read secrets from file
      include_vars:
        file: ../local/secrets.yml

    - name: ubuntu - set timezone
      community.general.timezone:
        name: "{{ timezone }}"

    - name: ubuntu - upgrade all outdated packages
      apt:
        upgrade: dist
        update_cache: true
        autoremove: yes
        autoclean: yes

    - name: ubuntu - check if base packages are installed
      apt:
        name: bash-completion, curl, ethtool, git, iftop, iotop, lsof, mariadb-client, ncdu, net-tools, openssh-server, plocate, python3-requests, rsync, wget
        state: present
        update_cache: true

    # deb822_repository (docker.yml, security.yml, syslog-ng.yml) fails without
    # python3-debian, even in check mode, so install it during dry runs too.
    - name: ubuntu - ensure python3-debian is installed for deb822_repository
      apt:
        name: python3-debian
        state: present
      check_mode: false

    - name: bash - update bashrc
      copy:
        src: files/bash.bashrc
        dest: /etc/bash.bashrc
        owner: root
        group: root
        mode: 0644

    - name: bash - update MOTD
      copy:
        src: "{{ item }}"
        dest: /etc/update-motd.d/
        owner: root
        group: root
        mode: 0755
      with_fileglob:
        - "files/10-help-text"
        - "files/89-docker-info"
      notify: Update MOTD

    - name: ssh - configure service
      copy:
        src: files/sshd_config
        dest: /etc/ssh/sshd_config
        owner: root
        group: root
        mode: 0644
      notify: Restart ssh

    - name: sysctl - configure sysctl.conf
      copy:
        src: files/sysctl.conf
        dest: /etc/sysctl.conf
        owner: root
        group: root
        mode: 0644
      notify: Reload sysctl

    - name: postfix - gather service facts
      service_facts:

    - name: postfix - ensure service is disabled and stopped
      service:
        name: postfix
        state: stopped
        enabled: no
      when: "'postfix.service' in ansible_facts['services']"

    - name: slack-notify - ensure config directory exists
      file:
        path: /etc/slack-notify
        state: directory
        owner: root
        group: root
        mode: 0755

    - name: slack-notify - configure webhook file
      copy:
        content: "{{ slack_notify_webhook_url }}\n"
        dest: /etc/slack-notify/webhook
        owner: root
        group: root
        mode: 0644

    - name: slack-notify - install script
      copy:
        src: files/slack-notify
        dest: /usr/local/bin/slack-notify
        owner: root
        group: root
        mode: 0755

  handlers:
    - name: Restart ssh
      service:
        name: ssh
        state: restarted

    - name: Reload sysctl
      become: yes
      command: sysctl -p

    - name: Update MOTD
      become: yes
      command: run-parts /etc/update-motd.d

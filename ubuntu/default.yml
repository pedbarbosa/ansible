---
- hosts: all
  become: yes
  become_user: root
  tasks:
  # - name: ubuntu - Set apt base sources
  #   copy:
  #     src: files/sources.list_jammy
  #     dest: /etc/apt/sources.list
  #     owner: root
  #     group: root
  #     mode: 0664

  - name: ubuntu - Upgrade all outdated packages
    apt:
      upgrade: dist
      update_cache: true
      autoremove: yes
      autoclean: yes

  - name: ubuntu - Check if base packages are installed
    apt:
      name: bash-completion, curl, ethtool, git, iftop, iotop, lsof, meld, ncdu, net-tools, openssh-server, plocate, rsync, wget
      state: present
      update_cache: true

  - name: bash - Update bashrc
    copy:
      src: files/bash.bashrc
      dest: /etc/bash.bashrc
      owner: root
      group: root
      mode: 0644

  - name: bash - Update MOTD
    copy:
      src: "{{ item }}"
      dest: /etc/update-motd.d/
      owner: root
      group: root
      mode: 0755
    with_fileglob:
      - "files/10-help-text"
      - "files/89-docker-info"
    notify: Update MOTD

  - name: bash - Disable MOTD news
    ansible.builtin.lineinfile:
      path: /etc/default/motd-news
      regexp: '^ENABLED='
      line: 'ENABLED=0'
      state: present
    notify: Update MOTD

  - name: ssh - Configure service
    copy:
      src: files/sshd_config
      dest: /etc/ssh/sshd_config
      owner: root
      group: root
      mode: 0644
    notify: Restart ssh

  - name: Configure sysctl.conf
    copy:
      src: files/sysctl.conf
      dest: /etc/sysctl.conf
      owner: root
      group: root
      mode: 0644
    notify: Reload sysctl

  handlers:
  - name: Restart ssh
    service:
      name: ssh
      state: restarted

  - name: Reload sysctl
    become: yes
    command: sysctl -p

  - name: Update MOTD
    become: yes
    command: run-parts /etc/update-motd.d

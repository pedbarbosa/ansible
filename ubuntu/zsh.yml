---
- hosts: all
  become: yes
  become_user: root
  tasks:
    - name: zsh - check if zsh and starship are installed
      apt:
        name: zsh, starship
        state: present

    - name: zsh - read secrets from file
      include_vars:
        file: ../local/secrets.yml

    - name: zsh - set default shell
      user:
        name: "{{ main_user_account }}"
        shell: /bin/zsh

- hosts: all
  tasks:
    - name: zsh - configure zshrc for user
      template:
        src: files/zshrc.j2
        dest: ~/.zshrc

    - name: zsh - ensure config directory exists for user
      file:
        path: ~/.config
        state: directory

    - name: zsh - configure starship prompt for user
      copy:
        src: files/starship.toml
        dest: ~/.config/starship.toml

    - name: zsh - configure oh-my-zsh for user
      git:
        repo: 'https://github.com/robbyrussell/oh-my-zsh.git'
        dest: ~/.oh-my-zsh
        update: yes

    - name: zsh - remove Powerlevel10k theme, replaced by starship
      file:
        path: ~/.oh-my-zsh/custom/themes/powerlevel10k
        state: absent

    - name: zsh - configure fzf for user
      git:
        repo: 'https://github.com/junegunn/fzf.git'
        dest: ~/.fzf
        update: yes
      register: fzf

    - name: zsh - install fzf on user
      command: chdir=~/.fzf ./install --key-bindings --completion --update-rc
      when: fzf.changed

---
- hosts: all
  become: yes
  become_user: root
  tasks:
    - name: syslog-ng - configure repository
      ansible.builtin.deb822_repository:
        name: syslog-ng-ose
        types: deb
        uris: https://ose-repo.syslog-ng.com/apt/
        suites: stable
        components: "ubuntu-{{ ansible_facts['distribution_release'] }}"
        signed_by: https://ose-repo.syslog-ng.com/apt/syslog-ng-ose-pub.asc

    # The old key sat in trusted.gpg.d, which trusts it for every repository;
    # the deb822 repo above now pins its own copy under /etc/apt/keyrings.
    - name: syslog-ng - remove old one-line repo file and globally trusted key
      file:
        path: "{{ item }}"
        state: absent
      loop:
        - /etc/apt/sources.list.d/syslog-ng-ose.list
        - /etc/apt/trusted.gpg.d/syslog-ng-key.asc

    - name: syslog-ng - ensure rsyslog is absent
      apt:
        name: rsyslog
        state: absent

    - name: syslog-ng - check if installed
      apt:
        name: syslog-ng
        state: present

    - name: syslog-ng - configure service
      copy:
        src: files/syslog-ng.conf
        dest: /etc/syslog-ng/syslog-ng.conf
        owner: root
        group: root
        mode: 0644
      notify: syslog-ng - Reload service

    - name: syslog-ng - configure remote listener
      copy:
        src: files/syslog-ng_remote.conf
        dest: /etc/syslog-ng/conf.d/remote.conf
        owner: root
        group: root
        mode: 0644
      notify: syslog-ng - Reload service

    - name: syslog-ng - configure logrotate for service
      copy:
        src: files/logrotate-syslog-ng.conf
        dest: /etc/logrotate.d/syslog-ng-remote
        owner: root
        group: root
        mode: 0644
      notify: syslog-ng - Reload service

    - name: syslog-ng - ensure service is enabled
      service:
        name: syslog-ng
        enabled: yes

  handlers:
    - name: syslog-ng - Reload service
      service:
        name: syslog-ng
        state: reloaded

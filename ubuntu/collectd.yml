---
- hosts: all
  become: yes
  become_user: root
  vars_files:
    - ../local/secrets.yml
  tasks:
    # lm-sensors: the sensors plugin reads its /etc/sensors3.conf
    - name: collectd - check if installed
      apt:
        name: collectd, lm-sensors
        state: present

    - name: collectd - create group
      group:
        name: collectd
        gid: 1003
        state: present

    - name: collectd - main configuration
      template:
        src: files/collectd.conf
        dest: /etc/collectd/collectd.conf
      notify: Restart collectd

    - name: collectd - df module configuration
      template:
        src: files/collectd.conf.d/df.conf
        dest: /etc/collectd/collectd.conf.d
      notify: Restart collectd

    - name: collectd - disk module configuration
      template:
        src: files/collectd.conf.d/disk.conf
        dest: /etc/collectd/collectd.conf.d
      notify: Restart collectd

    # Sends every metric to VictoriaMetrics' Graphite listener (server-stack's
    # monitoring profile)
    - name: collectd - write_graphite module configuration
      template:
        src: files/collectd.conf.d/graphite.conf
        dest: /etc/collectd/collectd.conf.d
      notify: Restart collectd

    - name: collectd - interface module configuration
      template:
        src: files/collectd.conf.d/interface.conf
        dest: /etc/collectd/collectd.conf.d
      notify: Restart collectd

    - name: collectd - logfile module configuration
      template:
        src: files/collectd.conf.d/logfile.conf
        dest: /etc/collectd/collectd.conf.d
      notify: Restart collectd

    - name: collectd - processes module configuration
      template:
        src: files/collectd.conf.d/processes.conf
        dest: /etc/collectd/collectd.conf.d
      notify: Restart collectd

    - name: collectd - rrdtool module configuration
      template:
        src: files/collectd.conf.d/rrdtool.conf
        dest: /etc/collectd/collectd.conf.d
      notify: Restart collectd

    - name: collectd - sensors module configuration
      template:
        src: files/collectd.conf.d/sensors.conf
        dest: /etc/collectd/collectd.conf.d
      notify: Restart collectd

    - name: collectd - smart module configuration
      template:
        src: files/collectd.conf.d/smart.conf
        dest: /etc/collectd/collectd.conf.d
      notify: Restart collectd

    - name: collectd - thermal module configuration
      template:
        src: files/collectd.conf.d/thermal.conf
        dest: /etc/collectd/collectd.conf.d
      notify: Restart collectd

    - name: collectd - unixsock module configuration
      template:
        src: files/collectd.conf.d/unixsock.conf
        dest: /etc/collectd/collectd.conf.d
      notify: Restart collectd

  handlers:
    - name: Restart collectd
      service:
        name: collectd
        state: restarted

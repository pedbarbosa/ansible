# Pin the system Python instead of letting discovery pick a versioned binary
# (e.g. python3.14) and warn that it may change. The apt-installed modules
# the playbooks rely on (python3-debian, python3-docker, python3-requests)
# live there.
ansible_python_interpreter: /usr/bin/python3

zsh_is_mac: false

# Accounts that get the zsh, Starship and vim setup, so a root shell (sudo -i)
# or sudo vim feels the same as the login user's. user_id is the account
# Ansible connects as, so only use this in plays without play-level become
# (facts gathered under become report root).
dotfile_users:
  - "{{ ansible_facts['user_id'] }}"
  - root

zsh_plugins:
  - command-not-found
  - cp
  - docker
  - docker-compose
  - git
  - gitfast
  - pip
  - rsync
  - sudo

ansible_user: root
# Dropbear has no sftp-server, and modern scp uses the SFTP protocol too, so
# Ansible's default sftp -> scp -> piped fallback warns twice per task before
# piped works. Go straight to piped.
ansible_ssh_transfer_method: piped

openwrt_packages_common:
  - avahi-dbus-daemon
  - collectd
  - collectd-mod-cpu
  - collectd-mod-df
  - collectd-mod-interface
  - collectd-mod-iwinfo
  - collectd-mod-load
  - collectd-mod-memory
  - collectd-mod-network
  - collectd-mod-processes
  - collectd-mod-uptime
  - diffutils
  - git
  - git-http
  - ip-bridge
  - msmtp
  - ncdu
  - rsync
  - tcpdump

openwrt_packages: "{{ openwrt_packages_common + (openwrt_packages_router if 'router' in group_names else []) }}"

# openwrt/collectd.yml
openwrt_collectd_plugins_common:
  - cpu
  - df
  - interface
  - iwinfo
  - load
  - memory
  - network
  - processes
  - uptime

openwrt_collectd_plugins: "{{ openwrt_collectd_plugins_common + (openwrt_collectd_plugins_router if 'router' in group_names else []) }}"

openwrt_collectd_server_port: 25826

openwrt_collectd_processes:
  - collectd
  - dnsmasq
  - dropbear
  - ntpd
  - odhcpd
  - pppd
  - uhttpd

# openwrt/system.yml
# POSIX TZ string for system.conf's `timezone` (e.g. AEST-10), derived from
# the IANA `timezone` secret: it's the footer line of the zone's TZif file,
# the same value LuCI picks. Runs on the Ansible controller, so it needs
# tzdata (/usr/share/zoneinfo) installed there.
openwrt_timezone: "{{ lookup('pipe', 'tail -n1 /usr/share/zoneinfo/' ~ timezone) }}"
openwrt_log_port: 514
openwrt_log_size: "{{ openwrt_log_size_router if 'router' in group_names else 64 }}"
openwrt_cronloglevel: "{{ openwrt_cronloglevel_router if 'router' in group_names else 5 }}"
openwrt_leds: []

# openwrt/wireless.yml (wireless.conf) - the SSIDs, the same on every device
# that has radios (openwrt_wifi_radios in its group_vars). `bands` picks the
# radios that carry each SSID by band rather than by radio name, since radio
# numbering differs between devices. `roaming` turns on 802.11r fast
# transition, which needs the same mobility_domain on every device. nasid is
# per device, so it's set on each radio in openwrt_wifi_radios instead.
# `network_last` writes `network` after `key`, where LuCI puts it for SSIDs
# added in its UI. SSIDs OpenWrt set up itself have it after `device`. It
# changes nothing on the device, but keeps the file in LuCI's order.
openwrt_wifi_ifaces:
  - name: default
    network: lan
    bands: [2g, 5g]
    ssid: "{{ openwrt_wifi_lan_ssid }}"
    key: "{{ openwrt_wifi_lan_key }}"
    encryption: psk2
    roaming: true
    mobility_domain: "{{ openwrt_wifi_lan_mobility_domain }}"
  - name: iot
    network: iot
    bands: [2g]
    ssid: "{{ openwrt_wifi_iot_ssid }}"
    key: "{{ openwrt_wifi_iot_key }}"
    encryption: psk-mixed
    network_last: true

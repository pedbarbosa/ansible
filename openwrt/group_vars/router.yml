openwrt_packages_router:
  - luci-app-adblock
  - luci-app-banip
  - collectd-mod-conntrack
  - collectd-mod-dns
  - collectd-mod-mqtt
  - collectd-mod-ping
  - collectd-mod-thermal

# openwrt/collectd.yml
openwrt_collectd_plugins_router:
  - conntrack
  - dns
  - mqtt
  - ping
  - thermal

# WAN latency/jitter/loss targets (router only; Ubuntu doesn't run the ping plugin)
openwrt_collectd_ping_hosts:
  - "{{ collectd_ping_host1 }}"
  - "{{ collectd_ping_host2 }}"
  - "{{ collectd_ping_host3 }}"
  - "{{ collectd_ping_host4 }}"
  - "{{ collectd_ping_host5 }}"
  - "{{ collectd_ping_host6 }}"

openwrt_collectd_dns_interfaces:
  - br-lan
  - br-lan.10
  - br-lan.20

openwrt_collectd_thermal_devices:
  - cooling_device0
  - cooling_device1

# openwrt/system.yml
openwrt_log_size_router: 16384
openwrt_cronloglevel_router: 7

openwrt_ntp_pool_servers:
  - 0.openwrt.pool.ntp.org
  - 1.openwrt.pool.ntp.org
  - 2.openwrt.pool.ntp.org
  - 3.openwrt.pool.ntp.org

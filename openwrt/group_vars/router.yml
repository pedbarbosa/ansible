openwrt_packages_router:
  - luci-app-adblock
  - luci-app-banip
  - collectd-mod-conntrack
  - collectd-mod-dns
  - collectd-mod-mqtt
  - collectd-mod-ping
  - collectd-mod-thermal
  - inotifywait
  - mosquitto-client-nossl

# openwrt/collectd.yml
openwrt_collectd_plugins_router:
  - conntrack
  - dns
  - mqtt
  - ping
  - thermal

# openwrt_collectd_ping_hosts (the ping plugin's targets) is in local/secrets.yml.
# Don't define it here too: group_vars/router.yml overrides group_vars/all/secrets.yml.

openwrt_collectd_dns_interfaces:
  - br-lan
  - br-lan.10
  - br-lan.20

openwrt_collectd_thermal_devices:
  - cooling_device0
  - cooling_device1

# openwrt/system.yml
openwrt_log_size_router: 16384
openwrt_cronloglevel_router: 7

openwrt_ntp_pool_servers:
  - 0.openwrt.pool.ntp.org
  - 1.openwrt.pool.ntp.org
  - 2.openwrt.pool.ntp.org
  - 3.openwrt.pool.ntp.org

# openwrt/wireless.yml (wireless.conf) - the router's two radios. Which SSIDs
# each radio carries is picked by band from openwrt_wifi_ifaces
# (group_vars/all/vars.yml).
openwrt_wifi_radios:
  - name: radio0
    path: platform/soc/18000000.wifi
    band: 2g
    htmode: HE20
    txpower: 13
  - name: radio1
    path: platform/soc/18000000.wifi+1
    band: 5g
    htmode: HE80
    txpower: 18

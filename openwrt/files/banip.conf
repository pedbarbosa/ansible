# File managed by Ansible - https://github.com/pedbarbosa/ansible

config banip 'global'
	option ban_enabled '1'
	option ban_debug '0'
	option ban_autodetect '1'
	list ban_logterm 'Exit before auth from'
	list ban_logterm 'luci: failed login'
	option ban_fetchretry '5'
	option ban_nicelimit '0'
	option ban_filelimit '1024'
	option ban_deduplicate '1'
	option ban_nftpriority '-100'
	option ban_icmplimit '25'
	option ban_synlimit '10'
	option ban_udplimit '100'
	option ban_nftpolicy 'memory'
	option ban_nftretry '5'
	option ban_blockpolicy 'drop'
	option ban_nftloglevel 'warn'
	option ban_logprerouting '0'
	option ban_loginbound '0'
	option ban_logoutbound '0'
	option ban_loglimit '100'
	option ban_mailnotification '1'
	option ban_mailreceiver 'admin@{{ domain }}'
	option ban_mailsender 'router@{{ domain }}'
	option ban_mailtopic 'banIP notification'
	option ban_mailprofile 'default'
	list ban_feed 'debl'
	list ban_feed 'drop'
	list ban_feed 'dshield'
	list ban_feed 'feodo'
	list ban_feed 'firehol1'
	list ban_feed 'greensnow'
	list ban_feed 'nixspam'
	list ban_feed 'threat'
	list ban_feed 'uceprotect1'
	list ban_feed 'voip'
	list ban_country 'af'
	list ban_country 'bd'
	list ban_country 'br'
	list ban_country 'cn'
	list ban_country 'hk'
	list ban_country 'hu'
	list ban_country 'in'
	list ban_country 'id'
	list ban_country 'ir'
	list ban_country 'iq'
	list ban_country 'il'
	list ban_country 'kp'
	list ban_country 'no'
	list ban_country 'pk'
	list ban_country 'pl'
	list ban_country 'ro'
	list ban_country 'ru'
	list ban_country 'sa'
	list ban_country 'kr'
	list ban_country 'th'
	list ban_country 'tr'
	list ban_country 'ua'
	list ban_country 'gb'
	option ban_autoallowlist '1'
	option ban_autoallowuplink 'subnet'
	option ban_autoblocklist '1'
	option ban_allowlistonly '0'
	option ban_fetchcmd 'uclient-fetch'
	option ban_protov4 '1'
	list ban_ifv4 'wan'
	list ban_dev 'pppoe-wan'

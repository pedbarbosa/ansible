# File managed by Ansible - https://github.com/pedbarbosa/ansible
{% for radio in openwrt_wifi_radios %}

config wifi-device '{{ radio.name }}'
	option type 'mac80211'
	option path '{{ radio.path }}'
	option channel '{{ radio.channel | default('auto') }}'
	option band '{{ radio.band }}'
	option htmode '{{ radio.htmode }}'
	option cell_density '0'
	option txpower '{{ radio.txpower }}'
	option country '{{ openwrt_wifi_country }}'
{% for iface in openwrt_wifi_ifaces if radio.band in iface.bands %}

config wifi-iface '{{ iface.name }}_{{ radio.name }}'
	option device '{{ radio.name }}'
	option network '{{ iface.network }}'
	option mode 'ap'
	option ssid '{{ iface.ssid }}'
	option encryption '{{ iface.encryption }}'
	option key '{{ iface.key }}'
{% if iface.roaming | default(false) %}
	option ieee80211r '1'
{% if radio.nasid is defined %}
	option nasid '{{ radio.nasid }}'
{% endif %}
	option mobility_domain '{{ iface.mobility_domain }}'
	option ft_over_ds '0'
	option ft_psk_generate_local '1'
{% endif %}
{% endfor %}
{% endfor %}

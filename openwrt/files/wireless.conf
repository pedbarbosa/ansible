# File managed by Ansible - https://github.com/pedbarbosa/ansible
{#
  Same order LuCI writes: SSIDs in openwrt_wifi_ifaces order, each radio's
  wifi-device just before its first SSID, then any radio with no SSIDs.
#}
{% macro wifi_device(radio) %}

config wifi-device '{{ radio.name }}'
	option type 'mac80211'
	option path '{{ radio.path }}'
	option channel '{{ radio.channel | default('auto') }}'
	option band '{{ radio.band }}'
	option htmode '{{ radio.htmode }}'
	option cell_density '0'
	option txpower '{{ radio.txpower }}'
	option country '{{ openwrt_wifi_country }}'
{% endmacro %}
{% set ns = namespace(done=[]) %}
{% for iface in openwrt_wifi_ifaces %}
{% for radio in openwrt_wifi_radios if radio.band in iface.bands %}
{% if radio.name not in ns.done %}
{% set ns.done = ns.done + [radio.name] %}
{{ wifi_device(radio) }}
{%- endif %}

config wifi-iface '{{ (radio.iface_sections | default({}))[iface.name] | default(iface.name ~ '_' ~ radio.name) }}'
	option device '{{ radio.name }}'
	option network '{{ iface.network }}'
	option mode 'ap'
	option ssid '{{ iface.ssid }}'
	option encryption '{{ iface.encryption }}'
	option key '{{ iface.key }}'
{% if iface.roaming | default(false) %}
	option ieee80211r '1'
{% if radio.nasid is defined %}
	option nasid '{{ radio.nasid }}'
{% endif %}
	option mobility_domain '{{ iface.mobility_domain }}'
	option ft_over_ds '0'
	option ft_psk_generate_local '1'
{% endif %}
{% endfor %}
{% endfor %}
{% for radio in openwrt_wifi_radios if radio.name not in ns.done %}
{{ wifi_device(radio) }}
{%- endfor %}

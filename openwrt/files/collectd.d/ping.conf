# File managed by Ansible - https://github.com/pedbarbosa/ansible

# Raw collectd config, pulled in through the UCI `Include` option, because
# /etc/init.d/collectd renders a UCI ping section as a bare `LoadPlugin ping`
# and so can't give it a reporting interval of its own. Pings go out every
# second; latency, stddev and drop rate are reported once per interval.
<LoadPlugin ping>
	Interval {{ openwrt_collectd_ping_interval }}
</LoadPlugin>

<Plugin ping>
{% for host in openwrt_collectd_ping_hosts %}
	Host "{{ host }}"
{% endfor %}
</Plugin>

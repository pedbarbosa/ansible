---
- name: openwrt/inventory (from secrets)
  hosts: localhost
  connection: local
  gather_facts: false
  # add_host only edits the in-memory inventory, never a device, yet always
  # reports "changed" - silence that so the recap only counts real changes.
  tasks:
    - name: openwrt - Register router
      changed_when: false
      add_host:
        name: gateway
        ansible_host: "{{ openwrt_router_host }}"
        openwrt_hostname: router
        groups:
          - openwrt
          - router

    - name: openwrt - Register APs
      changed_when: false
      add_host:
        name: "{{ item.name }}"
        ansible_host: "{{ item.host }}"
        openwrt_hostname: "{{ item.name }}"
        groups:
          - openwrt
          - ap
          - "{{ item.profile }}"
      loop: "{{ openwrt_ap_hosts }}"

---
- hosts: openwrt
  gather_facts: false
  tasks:
    - name: openwrt - Configure firewall
      community.openwrt.template:
        src: files/firewall.conf
        dest: /etc/config/firewall
      notify: openwrt - Restart firewall

  handlers:
    - name: openwrt - Restart firewall
      community.openwrt.service:
        name: firewall
        state: restarted

---
- hosts: all
  become: yes
  become_user: root
  tasks:
  - name: Check if collectd is installed
    apt:
      name: collectd
      state: present
  - name: Read secrets from file
    include_vars:
      file: ../secrets.yml
  - name: Configure collectd
    template:
      src: files/ubuntu.collectd.conf
      dest: /etc/collectd/collectd.conf
    notify: Restart collectd
  - name: Configure collectd df module
    template:
      src: files/collectd.conf.d/df.conf
      dest: /etc/collectd/collectd.conf.d
    notify: Restart collectd
  - name: Configure collectd disk module
    template:
      src: files/collectd.conf.d/disk.conf
      dest: /etc/collectd/collectd.conf.d
    notify: Restart collectd
  - name: Configure collectd interface module
    template:
      src: files/collectd.conf.d/interface.conf
      dest: /etc/collectd/collectd.conf.d
    notify: Restart collectd
  - name: Configure collectd logfile module
    template:
      src: files/collectd.conf.d/logfile.conf
      dest: /etc/collectd/collectd.conf.d
    notify: Restart collectd
  - name: Configure collectd ping module
    template:
      src: files/collectd.conf.d/ping.conf
      dest: /etc/collectd/collectd.conf.d
    notify: Restart collectd
  - name: Configure collectd processes module
    template:
      src: files/collectd.conf.d/processes.conf
      dest: /etc/collectd/collectd.conf.d
    notify: Restart collectd
  - name: Configure collectd rrdtool module
    template:
      src: files/collectd.conf.d/rrdtool.conf
      dest: /etc/collectd/collectd.conf.d
    notify: Restart collectd
  - name: Configure collectd sensors module
    template:
      src: files/collectd.conf.d/sensors.conf
      dest: /etc/collectd/collectd.conf.d
    notify: Restart collectd
  - name: Configure collectd smart module
    template:
      src: files/collectd.conf.d/smart.conf
      dest: /etc/collectd/collectd.conf.d
    notify: Restart collectd
  - name: Configure collectd thermal module
    template:
      src: files/collectd.conf.d/thermal.conf
      dest: /etc/collectd/collectd.conf.d
    notify: Restart collectd
  - name: Configure collectd unixsock module
    template:
      src: files/collectd.conf.d/unixsock.conf
      dest: /etc/collectd/collectd.conf.d
    notify: Restart collectd
  handlers:
  - name: Restart collectd 
    service:
      name: collectd
      state: restarted


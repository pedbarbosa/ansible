# Read when ansible-playbook runs from this directory. Ansible uses only the
# first config file it finds, so this one replaces ~/.ansible.cfg and
# /etc/ansible/ansible.cfg rather than adding to them.

[defaults]
# Show only tasks that change something (with their -D diff) or fail. Tasks
# that are ok or skipped, banner included, are left out; PLAY RECAP still
# counts them. For the full output, run with
# ANSIBLE_DISPLAY_OK_HOSTS=true ANSIBLE_DISPLAY_SKIPPED_HOSTS=true.
display_ok_hosts = false
display_skipped_hosts = false

# Label tasks with [CHECK MODE] in a dry run (-C)
check_mode_markers = true

# Print -v task results as YAML rather than one long JSON line
callback_result_format = yaml
